<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <defs>
    <pattern id="cells50" width="50" height="50" patternUnits="userSpaceOnUse">
      <rect width="44" height="44" rx="6" fill="none" stroke="#b6c2d4" stroke-dasharray="4 3"/>
    </pattern>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#64748b" stroke-width="1.4" opacity="0.4"/>
    </pattern>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="none" stroke="#5d7086" stroke-width="1.5"/>
    </marker>
    <style>
      .title { font: 600 12.5px ui-monospace, Menlo, Consolas, monospace; letter-spacing: 1.5px; fill: #5d7086; }
      .ruler { font: 10px ui-monospace, Menlo, Consolas, monospace; fill: #5d7086; text-anchor: middle; }
      .lbl { font: 600 10px ui-monospace, Menlo, Consolas, monospace; text-anchor: middle; }
      .cap { font: 11px ui-monospace, Menlo, Consolas, monospace; fill: #16324f; text-anchor: middle; }
      .ib { fill: #2563eb; fill-opacity: 0.10; stroke: #2563eb; stroke-width: 1.5; }
      .id { fill: #b45309; fill-opacity: 0.14; stroke: #b45309; stroke-width: 1.5; }
      .ii { fill: #64748b; fill-opacity: 0.08; stroke: #64748b; stroke-width: 1.5; }
      .tb { fill: #2563eb; } .td { fill: #b45309; } .ti { fill: #64748b; }
    </style>
  </defs>
  <rect width="900" height="500" rx="14" fill="#f4f7fb"/>

  <!-- closed -->
  <text class="title" x="60" y="40">CLOSED — the cover shows columns 4–7</text>
  <text class="ruler" x="82" y="64">4</text><text class="ruler" x="132" y="64">5</text>
  <text class="ruler" x="182" y="64">6</text><text class="ruler" x="232" y="64">7</text>
  <rect x="60" y="72" width="194" height="344" fill="url(#cells50)"/>
  <rect class="ib" x="60" y="72" width="144" height="94" rx="6"/>
  <text class="lbl tb" x="132" y="114">x4 y0</text><text class="lbl tb" x="132" y="128">3&#215;2</text>
  <rect class="ib" x="60" y="172" width="144" height="44" rx="6"/>
  <text class="lbl tb" x="132" y="197">x4 y2 3&#215;1</text>
  <rect class="ib" x="60" y="222" width="144" height="94" rx="6"/>
  <text class="lbl tb" x="132" y="264">x4 y3</text><text class="lbl tb" x="132" y="278">3&#215;2</text>
  <rect class="ib" x="60" y="322" width="144" height="44" rx="6"/>
  <text class="lbl tb" x="132" y="347">x4 y5 3&#215;1</text>
  <rect class="ib" x="60" y="372" width="144" height="44" rx="6"/>
  <text class="lbl tb" x="132" y="397">x4 y6 3&#215;1</text>
  <rect class="id" x="210" y="72" width="44" height="344" rx="6"/>
  <text class="lbl td" x="232" y="238">dock</text><text class="lbl td" x="232" y="252">x7</text>

  <!-- arrow -->
  <line x1="296" y1="206" x2="296" y2="282" stroke="#5d7086" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="296" y1="244" x2="392" y2="244" stroke="#5d7086" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text class="lbl" x="344" y="230" fill="#5d7086">unfold</text>

  <!-- opened -->
  <text class="title" x="420" y="40">OPENED — the left half is added</text>
  <text class="ruler" x="442" y="64">0</text><text class="ruler" x="492" y="64">1</text>
  <text class="ruler" x="542" y="64">2</text><text class="ruler" x="592" y="64">3</text>
  <text class="ruler" x="642" y="64">4</text><text class="ruler" x="692" y="64">5</text>
  <text class="ruler" x="742" y="64">6</text><text class="ruler" x="792" y="64">7</text>
  <rect x="420" y="72" width="426" height="344" fill="url(#cells50)"/>
  <rect class="ii" x="420" y="72" width="194" height="144" rx="6"/>
  <rect x="420" y="72" width="194" height="144" rx="6" fill="url(#hatch)"/>
  <text class="lbl ti" x="517" y="139">x0 y0 4&#215;3</text><text class="lbl ti" x="517" y="153">appears on open</text>
  <rect class="ii" x="420" y="222" width="194" height="144" rx="6"/>
  <rect x="420" y="222" width="194" height="144" rx="6" fill="url(#hatch)"/>
  <text class="lbl ti" x="517" y="289">x0 y3 4&#215;3</text><text class="lbl ti" x="517" y="303">appears on open</text>
  <rect class="ii" x="420" y="372" width="194" height="44" rx="6"/>
  <rect x="420" y="372" width="194" height="44" rx="6" fill="url(#hatch)"/>
  <text class="lbl ti" x="517" y="397">x0 y6 4&#215;1 &#183; appears on open</text>
  <rect class="ib" x="620" y="72" width="144" height="94" rx="6"/>
  <text class="lbl tb" x="692" y="114">x4 y0</text><text class="lbl tb" x="692" y="128">3&#215;2</text>
  <rect class="ib" x="620" y="172" width="144" height="44" rx="6"/>
  <text class="lbl tb" x="692" y="197">x4 y2 3&#215;1</text>
  <rect class="ib" x="620" y="222" width="144" height="94" rx="6"/>
  <text class="lbl tb" x="692" y="264">x4 y3</text><text class="lbl tb" x="692" y="278">3&#215;2</text>
  <rect class="ib" x="620" y="322" width="144" height="44" rx="6"/>
  <text class="lbl tb" x="692" y="347">x4 y5 3&#215;1</text>
  <rect class="ib" x="620" y="372" width="144" height="44" rx="6"/>
  <text class="lbl tb" x="692" y="397">x4 y6 3&#215;1</text>
  <rect class="id" x="770" y="72" width="44" height="344" rx="6"/>
  <text class="lbl td" x="792" y="238">dock</text><text class="lbl td" x="792" y="252">x7</text>
  <line x1="617" y1="66" x2="617" y2="422" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
  <text class="lbl" x="617" y="440" fill="#dc2626">fold line</text>

  <text class="cap" x="450" y="466">Nothing moves: the right half keeps its place, its pixels and its coordinates;</text>
  <text class="cap" x="450" y="482">the left half is added. Same layout, same cell size, same launcher activity (#120).</text>
</svg>
