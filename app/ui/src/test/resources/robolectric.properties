# Every Robolectric test in :app:ui runs at SDK 36, the targetSdk we ship.
#
# Without this file Robolectric picks compileSdk, 37, and on 37 a hardware
# capture (Roborazzi, captureToImage, PixelCopy) can return a stale frame:
# a white window with PixelCopy reporting success, while a software
# View.draw of the same view has content (#251).
#   https://github.com/robolectric/robolectric/issues/11392
#   https://github.com/takahirom/roborazzi/issues/912
# Remove this pin when robolectric/robolectric#11392 is fixed in the
# Robolectric version we use, and re-run #251's measurement at 37 first.
#
# Set here rather than per class, so a screenshot test added later runs at
# 36 without anybody having to know.
sdk=36
