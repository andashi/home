name: Release

# A tag v<version> produces a signed release APK and publishes it as a GitHub
# release with a SHA256SUMS file. The andashi provisioning repo fetches it from
# there (apks/fetch.sh), verifies the signer certificate and pins the hash.
#
# The release body is the tag annotation, so `git tag -a` is where a release is
# described - a lightweight tag fails the build. End the annotation with a
# trailer naming what the release closes. Exactly three forms are valid:
#
#     Security-Fixes: #7, #8, #12, #13   issues closed, against andashi/home
#     Security-Fixes: none               someone checked, nothing security-relevant
#     Security-Fixes: unspecified        nobody said - the default when absent
#
# It is a contract with the provisioning host, which parses `.body` from the
# releases API and has to tell a routine update from one that closes
# vulnerabilities. `none` and `unspecified` are deliberately distinct: nobody
# having said is not the same as there being nothing, and a release process
# must not imply safety it was never told about. The host treats `unspecified`
# as unknown, therefore urgent.
#
# The trailer is produced by this workflow from v0.4.0 on. Before that it is
# not: v0.1.0 to v0.2.1 predate the convention and carry none at all, and
# v0.3.0's trailer was written into the release body by hand, which makes it
# the one release whose body and tag annotation differ. A host reading the
# body can rely on v0.3.0; a host reading the annotation cannot.
#
# A tag with a SemVer pre-release suffix (v1.4.0-rc.1) publishes as a
# prerelease and never as `latest`. `latest` is what the host resolves when a
# zone pins no tag, so a release candidate landing there would install itself
# everywhere - and a fork whose `latest` points at something old is a fork
# whose security updates do not arrive.
#
# Nothing is built or published before the full test suite, both emulator
# suites included, is green on the commit being released: both jobs below need
# `tests`. Why the release repeats what main already ran: AGENTS.md § Releases
# (#132).
#
# Signing needs four repository secrets: KEYSTORE_BASE64 (the .jks, base64),
# KEYSTORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD. Only the
# `release` job reads them, and it runs on a tag push alone. A manual run (any
# ref, a tag included) runs `dry-run` instead: the full suite and the release
# build (R8, resource shrinking), no key, no upload. A branch build signed with
# the production key would be downloadable by anyone who can read the
# repository, and the signer certificate would no longer tell it from a
# release. .github/scripts/check-release-gate.py enforces both in CI.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/test.yml

  # Manual runs. No secret is in reach, so the release build comes out
  # unsigned: nothing can install it, and nothing is uploaded (#137).
  dry-run:
    needs: tests
    if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        run: ./gradlew :app:app:assembleDefaultRelease
      - name: Check the APK is unsigned
        run: |
          set -euo pipefail
          # Named app-default-release-unsigned.apk when unsigned; take the one
          # APK there, so a signed one is caught by its signature, not missed
          # by its name.
          apks=(app/app/build/outputs/apk/default/release/*.apk)
          [ "${#apks[@]}" = 1 ] || { echo "::error::expected one release APK, found: ${apks[*]}" >&2; exit 1; }
          apk="${apks[0]}"
          bt="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          # Captured first: grep -q stops reading early, and under pipefail the
          # SIGPIPE it leaves aapt2 with would fail the step.
          badging="$("$bt/aapt2" dump badging "$apk")"
          grep -q "package: name='org.andashi.home'" <<<"$badging"
          # Any signature fails the run: with no key in reach, a signed APK
          # means the build fell back to one - the debug key, as it did
          # before #137 - and a debug-signed APK with the release id is what
          # breaks a zone when installed over a release.
          if certs="$("$bt/apksigner" verify --print-certs "$apk" 2>/dev/null)"; then
            printf '%s\n' "$certs"
            echo "::error::a manual run produced a signed APK: $apk" >&2
            exit 1
          fi

  release:
    needs: tests
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    # The platform-side half of the tag gate. Declared, the environment changes
    # nothing by itself: without protection rules the job still reads the
    # repository secrets. Once the four secrets live in it as environment
    # secrets, with deployments restricted to `v*` tags, GitHub withholds the
    # key from any other ref, whatever the conditions above say.
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/keystore.jks"

      - name: Derive version from tag
        run: |
          echo "VERSION_NAME_OVERRIDE=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"
          echo "VERSION_CODE_OVERRIDE=$(date -u +%Y%m%d%H)" >> "$GITHUB_ENV"

      - name: Build and sign release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:app:assembleDefaultRelease

      - name: Name, hash and verify the APK
        run: |
          set -euo pipefail
          out=app/app/build/outputs/apk/default/release
          apk="org.andashi.home-${VERSION_NAME_OVERRIDE}.apk"
          mv "$out/app-default-release.apk" "$out/$apk"
          cd "$out"
          sha256sum "$apk" > SHA256SUMS
          # The APK must carry the release id and the release key, never the debug key.
          bt="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          # Captured first: grep -q stops reading early, and under pipefail the
          # SIGPIPE it leaves aapt2 with would fail the step.
          badging="$("$bt/aapt2" dump badging "$apk")"
          grep -q "package: name='org.andashi.home'" <<<"$badging"
          "$bt/apksigner" verify --print-certs "$apk" | tee CERTS.txt
          ! grep -qi "androiddebugkey\|CN=Android Debug" CERTS.txt
          echo "APK_PATH=$out/$apk" >> "$GITHUB_ENV"
          echo "SUMS_PATH=$out/SHA256SUMS" >> "$GITHUB_ENV"
          echo "CERTS_PATH=$out/CERTS.txt" >> "$GITHUB_ENV"

      - name: Compose release notes
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          # The annotation is where a release is actually described; the old
          # fixed sentence meant a carefully written tag message reached nobody.
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag"

          # A lightweight tag has no annotation, and %(contents) then quietly
          # falls back to the commit message: the release would be described by
          # whatever the last commit happened to say, and the trailer below
          # would report "unspecified" for it. Refuse instead of publishing
          # that.
          if [ "$(git cat-file -t "$tag")" != "tag" ]; then
            echo "::error::$tag is a lightweight tag. Create releases with 'git tag -a' - the annotation is the release body." >&2
            exit 1
          fi

          body="$(git tag -l --format='%(contents)' "$tag")"

          # Machine-readable, because the andashi provisioning host has to tell
          # "there is a new version" from "there is a new version that closes
          # four HIGH/MEDIUM issues" - the first gets dismissed, the second
          # puts someone at a cable. Written in the tag annotation as
          #   Security-Fixes: #7, #8, #12, #13
          # or "none". Absent means nobody said, which is not the same as none,
          # so it reports "unspecified" rather than claiming safety.
          # The annotation is where the trailer belongs, so in the normal case
          # the body already carries it and appending the extracted copy would
          # print it twice - which is what v0.3.1 published. Append only when
          # the annotation said nothing, and then say so explicitly.
          {
            printf '%s\n' "$body"
            printf '\n---\n\n'
            if ! printf '%s\n' "$body" | grep -qE '^Security-Fixes:'; then
              printf 'Security-Fixes: unspecified\n\n'
            fi
            printf 'Signed release build. Verify with SHA256SUMS; signer certificate in CERTS.txt.\n'
          } > "$RUNNER_TEMP/notes.md"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"

          # SemVer marks a pre-release with a hyphen after the patch version
          # (v1.4.0-rc.1). The v* trigger accepts those, and publishing one as
          # Latest would hand the provisioning host a release candidate as the
          # version to install when a zone pins no tag.
          # Strip build metadata before looking for the pre-release hyphen:
          # SemVer puts it after a '+' (v1.4.0+build-1), and a hyphen in there
          # would otherwise publish a stable release as a prerelease - which
          # leaves `latest` pointing at the older version and stops updates
          # from arriving at all.
          case "${tag%%+*}" in
            *-*) release_flags=(--prerelease --latest=false) ;;
            *)   release_flags=(--latest) ;;
          esac

          gh release create "$tag" \
            --title "Andashi Home ${VERSION_NAME_OVERRIDE}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "${release_flags[@]}" \
            "$APK_PATH" "$SUMS_PATH" "$CERTS_PATH"
