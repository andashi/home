name: Tests

# L1 (unit) + L3 (screenshot verify) on pull requests and on main.
# L2 (Compose UI on emulator) on PRs only — it is the slow layer; the fold
# suite runs on a second, foldable emulator in its own job.
# L4 stays manual/local: it needs the self-built GrapheneOS emulator (ADR 0005).

# `push` is limited to main on purpose. With a bare `push:` every commit on a
# PR branch ran this workflow twice - once for the push, once for the pull
# request - which doubles the cost and doubles the chance that a flake blocks a
# PR. It is not hypothetical: two concurrent runs of the same commit fetch
# Robolectric's android-all jar at the same moment, and on 2026-09-22 one of
# them lost it with a SocketException in MavenArtifactFetcher while its twin
# went green. A branch without a PR is not covered now, which is the accepted
# side of the trade.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  l1-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: >-
          ./gradlew
          :core:preferences:testDebugUnitTest
          :core:permissions:testDebugUnitTest
          :core:config:testDebugUnitTest
          :core:grid:test
          :services:config:testDebugUnitTest
          :data:database:testDebugUnitTest
          :data:searchable:testDebugUnitTest
          :data:appshortcuts:testDebugUnitTest
          :data:widgets:testDebugUnitTest
          :data:homegrid:testDebugUnitTest
          :data:themes:testDebugUnitTest
          :core:base:testDebugUnitTest
      # The coverage gate: every module the fork owns carries a line-coverage
      # bound in its build file, and this step fails the PR below it.
      - name: Coverage gate
        run: >-
          ./gradlew
          :core:config:koverVerifyDebug
          :core:grid:koverVerify
          :services:config:koverVerifyDebug
          :data:homegrid:koverVerifyDebug
          :app:ui:koverVerifyDebug
      - name: Upload coverage reports on failure
        if: ${{ failure() }}
        run: ./gradlew :core:config:koverHtmlReportDebug :core:grid:koverHtmlReport :services:config:koverHtmlReportDebug :data:homegrid:koverHtmlReportDebug :app:ui:koverHtmlReportDebug
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: kover-html
          path: |
            '**/build/reports/kover/htmlDebug'
            '**/build/reports/kover/html'
          retention-days: 14

  l3-screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify screenshot goldens
        run: ./gradlew :app:ui:verifyRoborazziDebug
      - name: Upload diff artifacts on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-diff
          path: |
            app/ui/src/test/roborazzi
            app/ui/build/outputs/roborazzi
          retention-days: 14

  l2-compose-ui:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      # GitHub's Linux runners support KVM but keep /dev/kvm root-only. Without
      # this the emulator runs with -accel off: API 36 took 505 s to boot and
      # then hung before the first test (two PR runs on 2026-09-19).
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compose UI tests on stock emulator (API 36)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: default
          arch: x86_64
          profile: pixel_6
          script: ./gradlew :app:ui:connectedDebugAndroidTest

  # The Fold (ADR 0001, D7) on a foldable AVD: HomeGridFoldTest switches the
  # device posture with `cmd device_state` and asserts the eight-column inner
  # layout, the four-column cover and the moves between them. The suite skips
  # itself by assumption on a device without postures, so the phone job above
  # stays green and this job is the one that proves the fold.
  l2-fold:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The runner's SDK has no Pixel Fold profile, and its classic "7.6in
      # Foldable" only masks half of one display when folded (the window
      # keeps its size, measured 2026-09-23), so the AVD is created from
      # that profile and rewritten to the Pixel Fold shape by
      # e2e/avd/pixel-fold.sh before launch: two logical displays, the cover
      # taking over when CLOSED. That needs a google_apis image, whose
      # advancedFeatures.ini carries SupportPixelFold.
      - name: List the SDK's foldable device profiles
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" list device | grep -B1 -A1 -i fold || true
      - name: Fold tests on a foldable emulator (API 36)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: "7.6in Foldable"
          avd-name: fold
          pre-emulator-launch-script: e2e/avd/pixel-fold.sh "$HOME/.android/avd/fold.avd/config.ini"
          script: ./gradlew :app:ui:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=de.mm20.launcher2.ui.launcher.grid.HomeGridFoldTest
